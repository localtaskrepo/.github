name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `--version` for the tool, for example `lotar --version` or `autospec --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and install method
      placeholder: macOS 15 via Homebrew, Windows 11 via Scoop, built from source, ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove tokens and personal data first.
      render: shell
